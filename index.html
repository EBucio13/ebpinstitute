<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="El Buen Pastor Bible Institute in Baytown, Texas — bilingual Berean Bible courses in partnership with Global University.">
<title>El Buen Pastor Bible Institute | Baytown, TX</title>

<style>
:root{
  --navy:#073b6f;
  --blue:#0b5ca8;
  --gold:#c79a32;
  --cream:#f7f5ef;
  --ink:#1d2935;
  --muted:#647181;
  --white:#fff;
  --line:#dde4ea;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:#fff;
  line-height:1.6;
}

a{color:inherit}
.wrap{width:min(1120px,92%);margin:auto}

.top{
  background:var(--navy);
  color:#fff;
  font-size:.9rem;
}

.top .wrap{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:8px 0;
  flex-wrap:wrap;
}

.top a{text-decoration:none}

nav{
  background:#fff;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid var(--line);
}

nav .wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  min-height:70px;
}

.brand{
  font-weight:800;
  color:var(--navy);
  text-decoration:none;
  line-height:1.15;
}

.brand small{
  display:block;
  color:var(--muted);
  font-weight:600;
  font-size:.72rem;
  margin-top:4px;
}

.links{
  display:flex;
  gap:22px;
  align-items:center;
}

.links a{
  text-decoration:none;
  font-weight:700;
  color:#344353;
  font-size:.92rem;
}

.links a:hover{color:var(--blue)}

.hero{
  background:linear-gradient(120deg,#073b6f,#0b5ca8);
  color:#fff;
  padding:86px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:50px;
  align-items:center;
}

.eyebrow{
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:800;
  color:#f1cf7b;
  font-size:.8rem;
}

.hero h1{
  font-size:clamp(2.3rem,5vw,4.5rem);
  line-height:1.05;
  margin:12px 0 18px;
}

.hero p{
  font-size:1.12rem;
  max-width:720px;
  color:#edf5fc;
}

.hero-card{
  background:#fff;
  color:var(--ink);
  padding:28px;
  border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.18);
}

.hero-card h3{
  color:var(--navy);
  margin-top:0;
}

.hero-card p{
  color:var(--ink);
  font-size:1rem;
  margin:8px 0;
}

.btn{
  display:inline-block;
  background:var(--gold);
  color:#17202a;
  text-decoration:none;
  font-weight:800;
  padding:13px 20px;
  border-radius:8px;
  margin:8px 8px 0 0;
}

.btn.secondary{
  background:#fff;
  color:var(--navy);
  border:2px solid #d6e2ec;
}

.hero .btn.secondary{
  background:transparent;
  color:#fff;
  border-color:#fff;
}

section{padding:72px 0}
.soft{background:var(--cream)}

.section-head{
  text-align:center;
  max-width:760px;
  margin:0 auto 36px;
}

.section-head h2{
  font-size:2.1rem;
  color:var(--navy);
  margin:0 0 10px;
}

.section-head p{color:var(--muted)}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
